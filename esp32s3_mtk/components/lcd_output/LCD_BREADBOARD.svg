<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-label="ESP32-S3 Super Mini to ST7789 LCD breadboard placement">
  <rect width="1100" height="850" fill="#f4f7fb"/>
  <text x="45" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#142b48">LCD-only breadboard test: use the LEFT A–E side</text>
  <text x="45" y="85" font-family="Arial, sans-serif" font-size="18" fill="#344963">ESP32-S3 Super Mini and LCD stay outside the breadboard. Each label points to one jumper hole.</text>
  <rect x="340" y="115" width="420" height="610" rx="18" fill="#eee7d2" stroke="#a99d7a" stroke-width="3"/>
  <rect x="363" y="130" width="40" height="565" fill="#d9e9f3"/>
  <line x1="383" y1="135" x2="383" y2="690" stroke="#1788bf" stroke-width="4"/>
  <text x="380" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#126995">− rail</text>
  <rect x="422" y="130" width="208" height="565" rx="6" fill="#f9f5e9"/>
  <rect x="639" y="130" width="89" height="565" rx="6" fill="#e5e3dd"/>
  <rect x="627" y="130" width="12" height="565" fill="#9f9c93"/>
  <text x="530" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#24364c">A   B   C   D   E</text>
  <text x="683" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#64717d">F–J</text>
  <text x="683" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64717d">unused</text>
  <text x="633" y="752" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#56606c">centre gap: no connection across</text>

  <g font-family="Arial, sans-serif" font-size="19" font-weight="bold">
    <circle cx="383" cy="185" r="8" fill="#116fa3"/><text x="45" y="192" fill="#145c89">ESP32 GND → blue rail hole N1</text>
    <circle cx="383" cy="215" r="8" fill="#116fa3"/><text x="45" y="222" fill="#145c89">LCD GND → blue rail hole N2</text>
    <circle cx="383" cy="245" r="8" fill="#116fa3"/><text x="45" y="252" fill="#145c89">LCD BL → blue rail hole N3</text>
  </g>
  <g stroke="#176f9f" stroke-width="2"><line x1="312" y1="185" x2="373" y2="185"/><line x1="312" y1="215" x2="373" y2="215"/><line x1="312" y1="245" x2="373" y2="245"/></g>

  <g font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    <text x="45" y="335" fill="#246a34">ESP32 3V3 → A4</text><text x="780" y="335" fill="#713e92">E4 ← LCD VCC</text>
    <text x="45" y="410" fill="#246a34">ESP32 GPIO12 → A10</text><text x="780" y="410" fill="#713e92">E10 ← LCD SCL / SCK</text>
    <text x="45" y="475" fill="#246a34">ESP32 GPIO11 → A11</text><text x="780" y="475" fill="#713e92">E11 ← LCD SDA / MOSI</text>
    <text x="45" y="540" fill="#246a34">ESP32 GPIO8 → A12</text><text x="780" y="540" fill="#713e92">E12 ← LCD RST</text>
    <text x="45" y="605" fill="#246a34">ESP32 GPIO9 → A13</text><text x="780" y="605" fill="#713e92">E13 ← LCD DC</text>
    <text x="45" y="670" fill="#246a34">ESP32 GPIO10 → A14</text><text x="780" y="670" fill="#713e92">E14 ← LCD CS</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4f5d6a">
    <text x="640" y="335">row 4</text><text x="640" y="410">row 10</text><text x="640" y="475">row 11</text><text x="640" y="540">row 12</text><text x="640" y="605">row 13</text><text x="640" y="670">row 14</text>
  </g>
  <g fill="#253b50">
    <circle cx="445" cy="328" r="6"/><circle cx="485" cy="328" r="6"/><circle cx="525" cy="328" r="6"/><circle cx="565" cy="328" r="6"/><circle cx="605" cy="328" r="6"/>
    <circle cx="445" cy="403" r="6"/><circle cx="485" cy="403" r="6"/><circle cx="525" cy="403" r="6"/><circle cx="565" cy="403" r="6"/><circle cx="605" cy="403" r="6"/>
    <circle cx="445" cy="468" r="6"/><circle cx="485" cy="468" r="6"/><circle cx="525" cy="468" r="6"/><circle cx="565" cy="468" r="6"/><circle cx="605" cy="468" r="6"/>
    <circle cx="445" cy="533" r="6"/><circle cx="485" cy="533" r="6"/><circle cx="525" cy="533" r="6"/><circle cx="565" cy="533" r="6"/><circle cx="605" cy="533" r="6"/>
    <circle cx="445" cy="598" r="6"/><circle cx="485" cy="598" r="6"/><circle cx="525" cy="598" r="6"/><circle cx="565" cy="598" r="6"/><circle cx="605" cy="598" r="6"/>
    <circle cx="445" cy="663" r="6"/><circle cx="485" cy="663" r="6"/><circle cx="525" cy="663" r="6"/><circle cx="565" cy="663" r="6"/><circle cx="605" cy="663" r="6"/>
  </g>
  <g fill="none" stroke-width="5">
    <circle cx="445" cy="328" r="13" stroke="#24933d"/><circle cx="605" cy="328" r="13" stroke="#8843ac"/>
    <circle cx="445" cy="403" r="13" stroke="#24933d"/><circle cx="605" cy="403" r="13" stroke="#8843ac"/>
    <circle cx="445" cy="468" r="13" stroke="#24933d"/><circle cx="605" cy="468" r="13" stroke="#8843ac"/>
    <circle cx="445" cy="533" r="13" stroke="#24933d"/><circle cx="605" cy="533" r="13" stroke="#8843ac"/>
    <circle cx="445" cy="598" r="13" stroke="#24933d"/><circle cx="605" cy="598" r="13" stroke="#8843ac"/>
    <circle cx="445" cy="663" r="13" stroke="#24933d"/><circle cx="605" cy="663" r="13" stroke="#8843ac"/>
  </g>
  <text x="45" y="790" font-family="Arial, sans-serif" font-size="19" fill="#263a51">A and E on the same row are connected inside the board. The blue rail connects its marked holes vertically.</text>
  <text x="45" y="820" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ae3d34">Unplug USB before wiring. Keep the blue rail separate from 3V3. Do not connect BL to GPIO13.</text>
</svg>
