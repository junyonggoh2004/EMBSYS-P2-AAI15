# Registry components, pinned (dependencies.lock records their hashes):
# esp-mqtt left ESP-IDF in v6 (the version the course port's examples lock);
# TFLite Micro is the release Arduino-ESP32 3.3.12 bundled, so inference
# results compare like for like.
dependencies:
  espressif/mqtt: "==1.1.0"
  espressif/esp-tflite-micro: "==1.4.0"
