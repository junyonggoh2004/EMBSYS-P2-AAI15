# D3-2 manual capture probe, current V2 sonar only: TRIG4/ECHO5.
# Verify HC-SR04+ identity, safe 3.3 V Echo and common ground before loading.
# Replaces volatile sensors/rules; leaves the sensor unarmed after SHOW.
# Send RUN for one capture, then TRIGGER D3_SONAR to rearm.
STOP
CLEAR
BEGINCFG|name=D3_SONAR|proto=gpio|gpio.mode=pulse|mode=poll|timing.mode=one_shot|timing.timeout_ms=100|gpio.trig=4|gpio.echo=5|gpio.pull=down|gpio.trig_us=10|gpio.pulse_timeout_us=30000|ENDCFG
SHOW
