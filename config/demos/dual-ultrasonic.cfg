# Use separate TRIG/ECHO pairs and 3.3 V-compatible ECHO signals.
# The LIGHT profile integrates for at least 120 ms. Trigger DISTANCE2
# from its completed reading so it does not overlap the first 30 ms echo capture.
STOP
CLEAR
BEGINCFG|name=DISTANCE|proto=gpio|gpio.mode=pulse|mode=poll|freq_hz=0.5|timing.timeout_ms=100|gpio.trig=4|gpio.echo=5|gpio.pull=down|gpio.trig_us=10|gpio.pulse_timeout_us=30000|ENDCFG
BEGINCFG|name=LIGHT|proto=i2c|i2c.sensor=tsl2561|mode=poll|freq_hz=0.5|timing.timeout_ms=600|i2c.sda=1|i2c.scl=2|i2c.addr=0x29|i2c.baud=100000|ENDCFG
BEGINCFG|name=DISTANCE2|proto=gpio|gpio.mode=pulse|mode=poll|timing.mode=event_driven|timing.trigger_source=LIGHT|timing.window_ms=100|timing.timeout_ms=100|gpio.trig=11|gpio.echo=12|gpio.pull=down|gpio.trig_us=10|gpio.pulse_timeout_us=30000|ENDCFG
ML MODEL sine-float
ML RESET
ML BIND 0 LIGHT light_lux 0 1000
ML BIND 1 DISTANCE distance_cm 2 400
ML BIND 2 DISTANCE2 distance_cm 2 400
ML RUN
SHOW
RUN
